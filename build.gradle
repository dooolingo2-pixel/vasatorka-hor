plugins {
    id "java"
    id "idea"
    id "eclipse"
    id "net.minecraftforge.gradle" version "[7.0.3,8)"
}

version = "1.0.0"
group = "com.vasatorka.mod"

base {
    archivesName = "vasatorka"
}

// Minecraft 1.21.11 працює на Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir "src/generated/resources" }

minecraft {
    mappings channel: "official", version: "1.21.11"
}

repositories {
    mavenCentral()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:1.21.11-61.1.9")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
